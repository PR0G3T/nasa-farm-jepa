[project]
name = "nasa-farm"
version = "0.1.0"
description = "Physics-informed latent world model for NASA-data-driven crop rotation decision support"
requires-python = ">=3.15"
dependencies = [
    "earthaccess>=0.19.0",
    "h5netcdf[h5py]>=1.8.0",
    "httpx2>=2.0.0",
    "pydantic>=2.14.3",
    "pystac-client>=0.9.1",
    "torch>=2.15.0",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[project.optional-dependencies]
hpo = ["optuna>=5.0.0"]
gee = ["earthengine-api>=1.5.26"]
serve = ["fastapi>=0.162.0", "granian>=2.8.5"]
gpu = ["nvidia-ml-py>=12.0.0"]
# 1 km training grid (`python -m nasa_farm.grid.run`): reprojection, STAC
# signing, REST calls. shapely: STATSGO2 polygons; cdsapi: ERA5-Land grids.
grid = [
    "rasterio>=1.5.2",
    "pyproj>=3.8.0",
    "planetary-computer>=1.0",
    "requests>=2.32",
    "pandas>=2.2",
    "shapely>=2.1",
    "cdsapi>=0.7",
    "icechunk>=2.3",
    "pyogrio>=0.13",
]
# CSB field vectors (`nasa-farm fields`): GeoParquet range-reads + CRS
# transform; icechunk samples the CDL Zarr store for rotation history.
csb = [
    "icechunk>=1.0",
    "pyarrow>=26.0.1",
    "pyproj>=3.8.0",
]

[project.scripts]
nasa-farm = "nasa_farm.commands:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nasa_farm"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
find-links = ["wheels"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
h5py = { path = "wheels/h5py-3.16.0-cp315-cp315t-manylinux_2_38_x86_64.whl" }
numcodecs = { path = "wheels/numcodecs-0.17.1-cp315-cp315t-manylinux_2_36_x86_64.whl" }
pyyaml = { path = "wheels/pyyaml-6.0.3-cp315-cp315t-manylinux_2_36_x86_64.whl" }
google-crc32c = { path = "wheels/google_crc32c-1.9.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
extend = "../rules/python/ruff.base.toml"
target-version = "py315"
extend-exclude = ["README.md"]

[tool.ruff.lint]
extend-select = [
    "A", "ASYNC", "C4", "DTZ", "EM", "ERA", "FLY", "G", "ICN", "INT",
    "ISC", "LOG", "PERF", "PGH", "PIE", "PTH", "Q", "RET", "RUF", "S",
    "SLOT", "T10", "TRY", "W", "YTT",
]
ignore = [
    # Scientific notation (×, ≤, °C, σ) in docs/comments is deliberate.
    "RUF001", "RUF002", "RUF003",
    # Inline f-string raise messages are the project style.
    "EM101", "EM102", "TRY003",
    # NASA endpoints, cloudflared tunnels and the lake's SQL are the features.
    "S310", "S603", "S608",
    # Local calendar dates are meaningful for agronomic forcing.
    "DTZ011",
]

[tool.ruff.lint.per-file-ignores]
"src/nasa_farm/state/crops.py" = ["E501"]
"tests/**" = ["S101"]
