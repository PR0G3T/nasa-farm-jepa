[project]
name = "nasa-farm"
version = "0.1.0"
description = "Physics-informed latent world model for NASA-data-driven crop rotation decision support"
requires-python = ">=3.15"
dependencies = [
    "earthaccess>=0.19.0",
    "h5netcdf[h5py]>=1.8.0",
    "httpx2>=2.0.0",
    "pydantic>=2.14.3",
    "pystac-client>=0.9.1",
    "torch>=2.15.0",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[project.optional-dependencies]
hpo = ["optuna>=5.0.0"]
gee = ["earthengine-api>=1.5.26"]
serve = ["fastapi>=0.162.0", "granian>=2.8.5"]
gpu = ["nvidia-ml-py>=12.0.0"]

[project.scripts]
nasa-farm = "nasa_farm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nasa_farm"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# PyPI torch = universal CUDA+CPU wheel (GPU auto-detected at runtime).
# For a slim CPU-only env: uncomment the line below to pin the cpu index.
# torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
