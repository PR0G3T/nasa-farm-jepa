services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - NASA_FARM_LAKE=/app/lake
      - NASA_FARM_JOBS=1
      - NASA_FARM_CACHE=128
      - NASA_FARM_CACHE_TTL=86400
    volumes:
      - ./lake:/app/lake
    command:
      - "nasa-farm"
      - "serve"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
